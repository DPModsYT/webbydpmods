<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DPMods Cyber ID</title>
    <style>
        :root {
            --bg-metal: #18181c;
            --neon-purple: #d500ff;
            --neon-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-dim: #a0a0a8;
            --font-sys: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            /* The blurred backdrop over your transparent Java WebView */
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-main);
            font-family: var(--font-sys);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- THE CYBER FRAME --- */
        .cyber-card {
            width: 90%;
            max-width: 420px;
            height: 85vh;
            max-height: 700px;
            background-color: var(--bg-metal);
            position: relative;
            /* Outer angled corners matching the reference */
            clip-path: polygon(8% 0, 100% 0, 100% 92%, 92% 100%, 0 100%, 0 8%);
            box-shadow: inset 0 0 0 1px #333;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            animation: bootUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes bootUp {
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(213, 0, 255, 0.5), inset 0 0 30px rgba(213, 0, 255, 0.4); }
            50% { box-shadow: 0 0 35px rgba(213, 0, 255, 0.8), inset 0 0 50px rgba(213, 0, 255, 0.6); }
            100% { box-shadow: 0 0 20px rgba(213, 0, 255, 0.5), inset 0 0 30px rgba(213, 0, 255, 0.4); }
        }

        /* --- THE CENTRAL PORTRAIT --- */
        .portrait-wrapper {
            position: absolute;
            top: 25px;
            left: 45px;
            right: 45px;
            bottom: 150px;
            background: url('https://raw.githubusercontent.com/DPModsYT/webbydpmods/refs/heads/main/IMG_20260514_135013.jpg') center/cover no-repeat;
            border: 2px solid var(--neon-purple);
            animation: pulseGlow 3s infinite ease-in-out;
            z-index: 1;
            /* Creates a slight curved edge inside the frame */
            border-radius: 10px;
        }

        /* --- HARDWARE ACCENTS --- */
        .hardware-screws {
            position: absolute;
            top: 20px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 5;
        }
        .screw {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #aaa;
            box-shadow: inset 1px 1px 3px #000, 0 0 2px rgba(255,255,255,0.2);
        }

        /* Top Left QR/Hologram placeholders */
        .qr-placeholder {
            position: absolute;
            top: 60px;
            left: 10px;
            width: 25px; height: 25px;
            background: repeating-linear-gradient(45deg, #fff, #fff 2px, transparent 2px, transparent 4px);
            border: 1px solid #fff;
            opacity: 0.8;
            z-index: 5;
        }
        .holo-placeholder {
            position: absolute;
            top: 95px;
            left: 10px;
            width: 25px; height: 25px;
            background: linear-gradient(135deg, #ccc, #fff, #666);
            opacity: 0.6;
            z-index: 5;
            border-radius: 2px;
        }

        /* --- VERTICAL BRANDING (LEFT EDGE) --- */
        .vertical-brand {
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
            writing-mode: vertical-rl;
            color: transparent;
            -webkit-text-stroke: 1px var(--neon-purple);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 5px;
            text-shadow: 0 0 15px var(--neon-purple);
            z-index: 5;
        }

        /* --- RIGHT EDGE DATA SPECS --- */
        .right-specs {
            position: absolute;
            right: 8px;
            top: 30px;
            display: flex;
            gap: 20px;
            writing-mode: vertical-rl;
            z-index: 5;
        }
        .spec-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .spec-label {
            color: var(--text-dim);
            font-size: 8px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .spec-value {
            color: var(--text-main);
            font-size: 10px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* --- BOTTOM LEFT ANGLED PANEL --- */
        .name-panel {
            position: absolute;
            bottom: 25px;
            left: 0;
            background: rgba(24, 24, 28, 0.95);
            backdrop-filter: blur(5px);
            padding: 15px 30px 15px 20px;
            border: 2px solid var(--neon-purple);
            border-left: none;
            /* Angled cut on top right */
            clip-path: polygon(0 0, 85% 0, 100% 25%, 100% 100%, 0 100%);
            z-index: 10;
        }
        .name-label { color: var(--neon-purple); font-size: 10px; font-weight: bold; letter-spacing: 2px; margin-bottom: 2px; }
        .name-value { color: var(--text-main); font-size: 28px; font-weight: 900; letter-spacing: 1px; margin-bottom: 12px; }
        .mission-label { color: var(--neon-purple); font-size: 9px; font-weight: bold; letter-spacing: 2px; margin-bottom: 2px; }
        .mission-value { color: var(--text-main); font-size: 13px; font-weight: bold; letter-spacing: 1px; }

        /* --- BOTTOM RIGHT CROSSHAIR LOGO --- */
        .cyber-logo {
            position: absolute;
            bottom: 30px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        .crosshair {
            width: 45px; height: 45px;
            border: 2px solid var(--text-main);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 15px var(--neon-purple);
        }
        .crosshair::before {
            content: ''; position: absolute;
            top: -12px; bottom: -12px; left: 50%; width: 2px; background: var(--text-main); transform: translateX(-50%);
        }
        .crosshair::after {
            content: ''; position: absolute;
            left: -12px; right: -12px; top: 50%; height: 2px; background: var(--text-main); transform: translateY(-50%);
        }
        .crosshair-center {
            position: absolute;
            top: 50%; left: 50%;
            width: 15px; height: 15px;
            border: 2px solid var(--neon-purple);
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .logo-text {
            font-size: 14px; font-weight: 900; letter-spacing: 3px;
            text-shadow: 0 0 8px var(--neon-purple);
        }

        /* --- BOTTOM CENTER META & BUTTON --- */
        .meta-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            color: var(--text-dim);
            letter-spacing: 2px;
            white-space: nowrap;
            z-index: 5;
        }

        .init-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 15px;
            font-family: var(--font-sys);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0,229,255,0.3);
            z-index: 20;
        }
        .init-btn:active {
            background: var(--neon-cyan);
            color: #000;
            transform: translateX(-50%) scale(0.95);
        }

    </style>
</head>
<body>

<div class="cyber-card" id="mainCard">
    
    <div class="portrait-wrapper"></div>

    <div class="hardware-screws">
        <div class="screw"></div>
        <div class="screw"></div>
    </div>
    <div class="qr-placeholder"></div>
    <div class="holo-placeholder"></div>

    <div class="vertical-brand">DPMODS VIP</div>

    <div class="right-specs">
        <div class="spec-block">
            <span class="spec-label">ID NUMBER</span>
            <span class="spec-value">DP-101101</span>
        </div>
        <div class="spec-block">
            <span class="spec-label">ADDRESS</span>
            <span class="spec-value">127.0.0.1_ROOT</span>
        </div>
        <div class="spec-block">
            <span class="spec-label">ISSUE DATE</span>
            <span class="spec-value">2026.MAY.14</span>
        </div>
        <div class="spec-block">
            <span class="spec-label">EXPIRED DATE</span>
            <span class="spec-value">LIFETIME_VIP</span>
        </div>
    </div>

    <div class="name-panel">
        <div class="name-label">NAME</div>
        <div class="name-value">DPMODS:</div>
        <div class="mission-label">MISSION CODE</div>
        <div class="mission-value">#AWAKEN_ENGINE</div>
        
        <div style="position:absolute; right:15px; top:50%; transform:translateY(-50%); width:20px; height:60px; background:repeating-linear-gradient(0deg, #fff, #fff 1px, transparent 1px, transparent 3px);"></div>
    </div>

    <button class="init-btn" onclick="triggerClose()">SYSTEM OVERRIDE</button>

    <div class="cyber-logo">
        <div class="crosshair">
            <div class="crosshair-center"></div>
        </div>
        <div class="logo-text">MODS</div>
    </div>

    <div class="meta-text">©&℗ DPMODS VIP ENTERTAINMENT INC.</div>

</div>

<script>
    // --- FLAWLESS ACTION://CLOSE INTEGRATION ---
    function triggerClose() {
        const card = document.getElementById('mainCard');
        const btn = document.querySelector('.init-btn');
        
        // Button visual feedback
        btn.style.background = 'var(--neon-cyan)';
        btn.style.color = '#000';
        btn.innerText = 'GRANTED...';

        // Trigger smooth CSS exit animation
        card.style.animation = 'none';
        card.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        card.style.transform = 'scale(0.85) translateY(40px)';
        card.style.opacity = '0';
        
        // Wait for animation, then send action URL back to Java Webby Engine
        setTimeout(() => {
            window.location.href = "action://close";
        }, 400);
    }
</script>

</body>
</html>
